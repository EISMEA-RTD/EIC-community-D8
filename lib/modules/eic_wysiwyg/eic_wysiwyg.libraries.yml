# Front-end styling for inline ECL popover annotations. The ECL component CSS
# and JS ship globally via oe_theme/component_library_ec, whose
# ecl_auto_init.js initialises the markup, so there is deliberately no
# JavaScript here. Attached conditionally by FilterDdcPopover, so only pages
# containing an annotation load it.
popover:
  version: VERSION
  css:
    component:
      css/popover.css: {}

# CKEditor 5 plugin. js/build/ddcPopover.js is generated by `npm run build`
# in this directory and is committed; nothing at runtime needs node.
ckeditor5.popover:
  version: VERSION
  js:
    js/build/ddcPopover.js: { minified: true }
  css:
    theme:
      css/popover.ckeditor5.css: {}
  dependencies:
    - core/ckeditor5

# Loaded on the text-format admin screen. Supplies the drag-and-drop toolbar
# builder's button icon; the editing-view styles come from the plugin's own
# library, which core also loads there for the live preview.
ckeditor5.popover.admin:
  version: VERSION
  css:
    theme:
      css/popover.admin.css: {}

# Makes tables in the editing view full width, matching ECL's
# .ecl-table { width: 100% } on the front end. Attached by the
# eic_wysiwyg_table_width CKEditor 5 plugin definition.
ckeditor5.table:
  version: VERSION
  css:
    theme:
      css/table.ckeditor5.css: {}
  dependencies:
    - core/ckeditor5.table

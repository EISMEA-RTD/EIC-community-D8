filter_settings.filter_ddc_popover:
  type: mapping
  label: 'ECL inline popover filter settings'
  mapping:
    show_close_button:
      type: boolean
      label: 'Show a close button inside the popover'
    # Retained so text formats saved against earlier renderings keep
    # validating. Neither has any effect: ECL Popover opens on click, and
    # there is no inverted popover style.
    enable_hover:
      type: boolean
      label: 'Deprecated: open on hover'
    inverted:
      type: boolean
      label: 'Deprecated: inverted tooltip style'

# This filter has shipped without schema since it was written; declaring it
# here keeps strict-schema checking (and config inspector) green.
filter_settings.eic_filter_div_tables:
  type: mapping
  label: 'Wrap tables with div tag filter settings'
  mapping:
    div_classes:
      type: string
      label: 'Div classes'
